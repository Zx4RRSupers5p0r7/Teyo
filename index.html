<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teyo | Find Anything. Buy Smarter</title>
    <meta name="description" content="Teyo helps you find products, compare options, and buy smarter with a faster, more social shopping experience." />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://teyo.ca/" />
    <meta property="og:title" content="Teyo | Find Anything. Buy Smarter" />
    <meta property="og:description" content="Teyo helps you find products, compare options, and buy smarter with a faster, more social shopping experience." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/teyo-custom-logo.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Teyo | Find Anything. Buy Smarter" />
    <meta name="twitter:description" content="Teyo helps you find products, compare options, and buy smarter with a faster, more social shopping experience." />
    <meta name="twitter:image" content="/teyo-custom-logo.svg" />
    <link rel="icon" href="/teyo-custom-logo.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/teyo-logo.png" type="image/png" />
    <link rel="mask-icon" href="/teyo-custom-logo.svg" color="#f5f5f5" />
    <link rel="apple-touch-icon" href="/teyo-custom-logo.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Paste your own Google OAuth Web Client ID from Google Cloud Console here.
      window.TEYO_GOOGLE_CLIENT_ID = '902032103838-k6q5oi67vmn6grp562mh1bcbjta1eiml.apps.googleusercontent.com';
    </script>
  </head>
  <body class="blank-page">
    <!-- ==========================================================
         SECTION 01: PAGE STRUCTURE / LANDING PAGE LAYOUT
         Edit this area to change the logo, search bar, tagline,
         filters, results panel, and owner tools panel.
         ========================================================== -->
    <div class="blank-stage" aria-label="Luxury Teyo landing page">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="ambient ambient-three"></div>

      <!-- SECTION 02: BRANDING / LOGO AREA -->
      <a href="/index.html" class="logo-link" aria-label="Teyo home">
        <img class="logo-mark" src="/teyo-custom-logo.svg" alt="Teyo logo" />
      </a>

      <!-- SECTION 03: MAIN SEARCH BAR -->
      <div class="search-shell" aria-label="Search products">
        <input type="text" class="search-bar" placeholder="What are you looking for..." aria-label="What are you looking for..." />
      </div>

      <!-- SECTION 04: HERO TAGLINE -->
      <div class="tagline-wrap">
        <p class="tagline">Making your life</p>
        <p class="tagline tagline">easier.</p>
      </div>

      <!-- SECTION 05: POPULAR SEARCHES -->
      <aside class="popular-searches hidden" aria-live="polite" aria-label="Popular searches">
        <div class="popular-searches-header">Popular searches</div>
        <ol class="popular-searches-list"></ol>
      </aside>

      <!-- SECTION 06: FILTERS + SEARCH RESULTS -->
      <section class="search-results hidden" aria-live="polite">
        <aside class="filter-panel" aria-label="Product preferences">
          <div class="filter-panel-header">
            <div class="filter-title">Preferences</div>
            <button id="clearPreferences" class="filter-clear" type="button">Clear all</button>
          </div>
          <label class="preference-search-label" for="preferenceSearch">Search preferences</label>
          <input id="preferenceSearch" class="preference-search" type="search" placeholder="Search preference types..." />
          <div id="selectedPreferences" class="selected-preferences hidden" aria-live="polite"></div>
          <div class="preference-section-title">Recommended</div>
          <div id="filterGroups" class="filter-groups"></div>
          <button id="morePreferences" class="more-preferences" type="button">More preferences</button>
          <div id="moreFilterGroups" class="filter-groups more-filter-groups hidden"></div>
        </aside>

        <!-- SECTION 07: PRODUCT RESULTS GRID -->
        <div class="results-panel">
          <div class="results-header">
            <span class="results-label"></span>
            <span id="resultsQuery" class="results-query"></span>
          </div>
          <div id="productGrid" class="product-grid" aria-live="polite"></div>
        </div>
      </section>

      <!-- SECTION 08: OWNER ACCESS TOOLS -->
      <!-- Hidden until the server confirms the verified owner account. -->
      <button id="ownerGoogleSignIn" class="owner-google-signin" type="button">Signin</button>
      <button id="ownerToolsButton" class="owner-tools-button" type="button" aria-expanded="false" aria-controls="ownerToolsPanel" aria-label="Owner catalog tools">
        <img class="owner-tools-logo" src="/teyo-custom-logo.svg" alt="" />
      </button>
      <aside id="ownerToolsPanel" class="owner-tools-panel" hidden>
        <h2>Owner catalog import</h2>
        <p>Paste a feed link from a store you own or have permission to represent.</p>
        <form id="ownerCatalogSyncForm">
          <label>Company name<input id="ownerCatalogCompanyName" required /></label>
          <label>Owner email<input id="ownerCatalogEmail" type="email" required /></label>
          <label>Store catalog link<input id="ownerCatalogSourceUrl" type="url" placeholder="https://store.example/products.json" required /></label>
          <button type="submit">Import products</button>
          <p id="ownerCatalogMessage" role="status"></p>
        </form>
      </aside>
    </div>
    <script src="teyo-taxonomy.js"></script>
    <script src="script.js?v=advanced-preferences"></script>
  </body>
</html>
