name: Keep Render Service Warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping production endpoints with retries
        run: |
          set -e
          urls=("https://teyo.ca/api/health" "https://teyo.ca/")
          for url in "${urls[@]}"; do
            echo "Pinging $url"
            ok=0
            for i in 1 2 3; do
              if curl --fail --silent --show-error --max-time 25 "$url" > /dev/null; then
                ok=1
                break
              fi
              echo "Attempt $i failed for $url, retrying..."
              sleep 8
            done
            if [ "$ok" -ne 1 ]; then
              echo "Failed to ping $url after retries"
              exit 1
            fi
          done
          echo "Keepalive ping completed."